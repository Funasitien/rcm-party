buildscript {
    repositories {
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.gradleup.shadow:shadow-gradle-plugin:9.0.0-beta4'
    }
}

apply plugin: 'java'
apply plugin: 'java-library'
apply plugin: 'com.gradleup.shadow'

group = 'group.aelysium'
version = module_version

repositories {
    mavenCentral()
    maven { url = "https://java.funa.dev/snapshots/" }
    maven { url = "https://java.funa.dev/releases/" }
}

dependencies {
    compileOnly 'org.incendo:cloud-core:2.0.0'
    compileOnly 'group.aelysium.rustyconnector:core:' + rustyconnector_version
    compileOnly 'group.aelysium.rustyconnector:rcm-friends:' + friends_version

    compileOnly 'net.kyori:adventure-api:4.17.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withJavadocJar()
    withSourcesJar()
}

compileJava {
    options.encoding = "UTF-8"
}

javadoc {
    options.encoding = 'UTF-8'
}

shadowJar {
    archiveBaseName.set(archives_base_name)
    archiveClassifier.set('')
    relocate "org.incendo", "group.aelysium.rustyconnector.velocity.org.incendo"
    mergeServiceFiles()
}

tasks.named('jar').configure {
    enabled = false
}
tasks.withType(JavaCompile) {
    options.compilerArgs += ['-Xdoclint:none']
}
tasks.withType(Javadoc) {
    options.addStringOption('Xdoclint:none', '-quiet')
}

jar.finalizedBy(shadowJar)
